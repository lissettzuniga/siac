<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{plantillas/plantilla :: head('Formulario Usuario')}"></head>
<body>

<div th:replace="~{plantillas/plantilla :: header}"></div>

<div class="container page-wrap">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-7">
            <div class="siac-panel">
                <div class="siac-panel-header primary">
                    <h1 class="h4 mb-0"
                        th:text="${modoEdicion} ? 'Editar Usuario' : 'Nuevo Usuario'">
                        Formulario Usuario
                    </h1>
                </div>

                <div class="siac-panel-body">

                    <div th:if="${errorCorreo != null}" class="alert alert-siac mb-4">
                        <span th:text="${errorCorreo}"></span>
                    </div>

                    <form th:action="${modoEdicion} ? @{/usuarios/actualizar/{id}(id=${usuario.id})} : @{/usuarios/guardar}"
                          th:object="${usuario}"
                          method="post"
                          novalidate>

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text"
                                       id="nombre"
                                       th:field="*{nombre}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('nombre')} ? ' is-invalid' : ''"
                                       placeholder="Ingresa el nombre">
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('nombre')}"
                                     th:errors="*{nombre}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="apPaterno" class="form-label">Apellido paterno</label>
                                <input type="text"
                                       id="apPaterno"
                                       th:field="*{apPaterno}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('apPaterno')} ? ' is-invalid' : ''"
                                       placeholder="Ingresa el apellido paterno">
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('apPaterno')}"
                                     th:errors="*{apPaterno}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="apMaterno" class="form-label">Apellido materno</label>
                                <input type="text"
                                       id="apMaterno"
                                       th:field="*{apMaterno}"
                                       class="form-control"
                                       placeholder="Ingresa el apellido materno">
                            </div>

                            <div class="col-md-6">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <input type="email"
                                       id="correo"
                                       th:field="*{correo}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('correo')} ? ' is-invalid' : ''"
                                       placeholder="ejemplo@correo.com">
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('correo')}"
                                     th:errors="*{correo}"></div>
                            </div>

                        </div>

                        <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
                            <button type="submit"
                                    class="btn btn-siac-primary"
                                    th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'">
                                Guardar
                            </button>

                            <a th:href="@{/usuarios}" class="btn btn-outline-light">
                                Cancelar
                            </a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{plantillas/plantilla :: footer}"></div>

</body>
</html>
