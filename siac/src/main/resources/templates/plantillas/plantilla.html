<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">SIAC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/tema/miestilo.css}">
</head>

<body>

<!--  NAVBAR -->
<header th:fragment="header">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-siac">
        <div class="container-fluid">

            <!-- LOGO -->
            <a class="navbar-brand fw-bold fs-4" th:href="@{/}">
                SIAC
            </a>

            <!-- BOTÓN RESPONSIVE -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSIAC">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- MENÚ -->
            <div class="collapse navbar-collapse" id="navbarSIAC">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <!--  USUARIOS  -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle px-3" href="#" role="button"
                           data-bs-toggle="dropdown">
                            👤 Usuarios
                        </a>
                        <ul class="dropdown-menu dropdown-siac">
                            <li>
                                <a class="dropdown-item" th:href="@{/usuarios}">
                                    📋 Lista
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/usuarios/nuevo}">
                                    ➕ Alta
                                </a>
                            </li>
                        </ul>
                    </li>

                    <!-- PRODUCTOS  -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle px-3" href="#" role="button"
                           data-bs-toggle="dropdown">
                            📦 Productos
                        </a>
                        <ul class="dropdown-menu dropdown-siac">
                            <li>
                                <a class="dropdown-item" th:href="@{/productos}">
                                    📋 Lista
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/productos/nuevo}">
                                    ➕ Alta
                                </a>
                            </li>
                        </ul>
                    </li>

                    <!--  REPORTES  -->
                    <li class="nav-item">
                        <a class="nav-link px-3" th:href="@{/reportes/inventario}">
                            📊 Reportes
                        </a>
                    </li>

                    <!--  IMAGEN  -->
                    <li class="nav-item">
                        <a class="nav-link px-3" th:href="@{/imagen/buscar}">
                            🔍 Imagen
                        </a>
                    </li>

                </ul>

                <!--  BUSCADOR  -->
                <form class="d-flex" role="search" th:action="@{/productos}" method="get">
                    <input class="form-control search-siac" type="search" name="q"
                           placeholder="Buscar producto..." aria-label="Search">
                    <button class="btn btn-light ms-2" type="submit">
                        Buscar
                    </button>
                </form>

            </div>
        </div>
    </nav>

    <!--  ALERTAS  -->
    <div class="container mt-3">
        <div class="alert alert-success" th:if="${success != null}" th:text="${success}"></div>
        <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>
        <div class="alert alert-warning" th:if="${warning != null}" th:text="${warning}"></div>
        <div class="alert alert-info" th:if="${info != null}" th:text="${info}"></div>
    </div>

</header>

<!--  FOOTER  -->
<footer th:fragment="footer">
    <div class="container text-center mt-5 mb-3">
        <hr/>
        <p class="mt-2 mb-0 fw-semibold">
            SIAC - Sistema de Inventario de Artículos Coleccionables
        </p>
        <small>Responsable: Lissett Zuñiga Reyes</small>
    </div>

    <!-- Bootstrap JS -->
    <script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>


    <script th:src="@{/bootstrap/js/jquery-3.6.3.js}"></script>
</footer>

</body>
</html>
