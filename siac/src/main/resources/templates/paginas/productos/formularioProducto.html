<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{plantillas/plantilla :: head(${modoEdicion} ? 'Editar Producto' : 'Nuevo Producto')}"></head>

<body>
<div th:replace="~{plantillas/plantilla :: header}"></div>

<div class="container page-wrap">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-9 col-xl-8">
            <div class="siac-panel">
                <div class="siac-panel-header primary">
                    <h2 class="h4 mb-1"
                        th:text="${modoEdicion} ? 'Editar producto' : 'Nuevo producto'">
                        Producto
                    </h2>
                    <p class="mb-0"
                       th:text="${modoEdicion} ? 'Actualiza la información del producto.' : 'Registra un nuevo producto en el inventario.'">
                    </p>
                </div>

                <div class="siac-panel-body">

                    <form th:object="${productoForm}"
                          th:action="${modoEdicion} ? @{/productos/actualizar/{id}(id=${productoForm.id})} : @{/productos/guardar}"
                          method="post"
                          novalidate>

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text"
                                       id="nombre"
                                       th:field="*{nombre}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('nombre')} ? ' is-invalid' : ''"
                                       placeholder="Ingresa el nombre del producto">
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('nombre')}"
                                     th:errors="*{nombre}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="precio" class="form-label">Precio</label>
                                <input type="number"
                                       id="precio"
                                       th:field="*{precio}"
                                       step="0.01"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('precio')} ? ' is-invalid' : ''"
                                       placeholder="0.00">
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('precio')}"
                                     th:errors="*{precio}"></div>
                            </div>

                            <div class="col-12">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea id="descripcion"
                                          th:field="*{descripcion}"
                                          class="form-control"
                                          th:classappend="${#fields.hasErrors('descripcion')} ? ' is-invalid' : ''"
                                          rows="3"
                                          placeholder="Describe el producto"></textarea>
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('descripcion')}"
                                     th:errors="*{descripcion}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="cantidadActual" class="form-label">Cantidad actual</label>
                                <input type="number"
                                       id="cantidadActual"
                                       th:field="*{cantidadActual}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('cantidadActual')} ? ' is-invalid' : ''"
                                       placeholder="0">
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('cantidadActual')}"
                                     th:errors="*{cantidadActual}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="categoriaId" class="form-label">Categoría</label>
                                <select id="categoriaId"
                                        th:field="*{categoriaId}"
                                        class="form-select"
                                        th:classappend="${#fields.hasErrors('categoriaId')} ? ' is-invalid' : ''">
                                    <option value="">Seleccione una categoría</option>
                                    <option th:each="categoria : ${categorias}"
                                            th:value="${categoria.id}"
                                            th:text="${categoria.nombre}">
                                    </option>
                                </select>
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('categoriaId')}"
                                     th:errors="*{categoriaId}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="tipoProductoId" class="form-label">Tipo de producto</label>
                                <select id="tipoProductoId"
                                        th:field="*{tipoProductoId}"
                                        class="form-select"
                                        th:classappend="${#fields.hasErrors('tipoProductoId')} ? ' is-invalid' : ''">
                                    <option value="">Seleccione un tipo de producto</option>
                                    <option th:each="tipo : ${tiposProducto}"
                                            th:value="${tipo.id}"
                                            th:text="${tipo.nombre}">
                                    </option>
                                </select>
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('tipoProductoId')}"
                                     th:errors="*{tipoProductoId}"></div>
                            </div>

                        </div>
                        <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
                            <button type="submit"
                                    class="btn btn-siac-primary"
                                    th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'">
                                Guardar
                            </button>

                            <a th:href="@{/productos}" class="btn btn-outline-light">
                                Cancelar
                            </a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{plantillas/plantilla :: footer}"></div>
</body>
</html>
